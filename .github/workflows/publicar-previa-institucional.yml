name: Publicar prévia acessos institucionais
on:
  push:
    branches: [feat/acessos-institucionais-2026-10-11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Compilar aplicativo
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://srabzgokulsiujusbqxl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TjLHUAq038yLQ2hqqaVZjg__GM4w2Q4
      - name: Publicar prévia isolada
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload --preview-alias acessos-institucionais 2>&1 | tee preview-output.txt
          echo "### Prévia — Acessos Institucionais" >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[^[:space:]\"]+' preview-output.txt | grep -E 'workers.dev|cloudflare' | sort -u | tee -a "$GITHUB_STEP_SUMMARY" || true
