name: Publicar prévia isolada
on:
  workflow_dispatch:
  push:
    branches: [ajustes-abertura-previa-20260928]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Compilar aplicativo com variáveis de prévia
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Verificar credenciais antes de publicar
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${{ vars.VITE_SUPABASE_URL }}" || { echo "Falta VITE_SUPABASE_URL"; exit 1; }
          test -n "${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}" || { echo "Falta VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
      - name: Criar prévia (nunca implantar produção)
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler preview --name ajustes-abertura-previa-20260928 --json > preview.json
          jq -r '.preview.urls[]' preview.json | tee -a "$GITHUB_STEP_SUMMARY"
