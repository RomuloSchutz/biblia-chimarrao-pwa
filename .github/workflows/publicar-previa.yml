name: Publicar prévia compra anual 2027
on:
  workflow_dispatch:
  push:
    branches: [lab-politica-compra-anual-2026-10-07]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab-politica-compra-anual-2026-10-07
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Aplicar fluxo anual 2027 no laboratório
        run: |
          python3 scripts/apply-annual-purchase-flow-lab.py
      - name: Validar integração anual e proteções comerciais
        run: |
          grep -F "import AnnualPurchasePanel" src/App.jsx
          grep -F "screen === 'annualPurchase'" src/App.jsx
          grep -F "devocional_chimarrao_com_deus_2027" src/App.jsx
          grep -F "accepted:true" src/App.jsx
          grep -F "mercado-pago-create-order" src/App.jsx
          if grep -Fq "Experimentar 3 encontros" src/App.jsx; then echo "Fluxo gratuito antigo ainda presente"; exit 1; fi
      - name: Persistir integração no laboratório
        run: |
          if ! git diff --quiet -- src/App.jsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.jsx
            git commit -m "Integrar compra anual 2027 no laboratório"
            git push origin HEAD:lab-politica-compra-anual-2026-10-07
          fi
      - name: Compilar aplicativo com variáveis de prévia
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://srabzgokulsiujusbqxl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TjLHUAq038yLQ2hqqaVZjg__GM4w2Q4
      - name: Verificar credenciais antes de publicar
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Publicar prévia isolada da compra anual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload --preview-alias lab-politica-compra-anual-2026-10-07 2>&1 | tee preview-output.txt
          echo "### Prévia compra anual 2027" >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[^[:space:]\"]+' preview-output.txt | grep -E 'workers.dev|cloudflare' | sort -u | tee -a "$GITHUB_STEP_SUMMARY" || true
