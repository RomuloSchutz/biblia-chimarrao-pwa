name: Publicar prévia isolada
on:
  workflow_dispatch:
  push:
    branches: [lab-commercial-prices-2026-10-07]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab-commercial-prices-2026-10-07
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Gravar preços e carência no código do laboratório
        run: |
          if ! grep -Fq "formatCommercialPrice(commercialCatalog[book.productCode].amountCents" src/App.jsx; then
            python3 scripts/apply-commercial-card-prices-lab.py
          fi
          if ! grep -Fq "edition_id:access.edition_id,download" src/App.jsx; then
            python3 scripts/apply-download-wait-lab.py
          fi
      - name: Validar código comercial consolidado
        run: |
          grep -F "formatCommercialPrice(commercialCatalog[book.productCode].amountCents" src/App.jsx
          test "$(grep -o "productCode:'" src/App.jsx | wc -l)" -eq 4
          grep -F "edition_id:access.edition_id,download" src/App.jsx
          grep -F "download_available_at" src/App.jsx
      - name: Persistir App.jsx corrigido na branch de laboratório
        run: |
          if ! git diff --quiet -- src/App.jsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.jsx
            git commit -m "Aplicar preços e carência de download no código do laboratório"
            git push origin HEAD:lab-commercial-prices-2026-10-07
          else
            echo "App.jsx já contém as correções comerciais."
          fi
      - name: Compilar aplicativo com variáveis de prévia
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://srabzgokulsiujusbqxl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TjLHUAq038yLQ2hqqaVZjg__GM4w2Q4
      - name: Verificar credenciais antes de publicar
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Publicar versão consolidada no alias isolado do laboratório
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload --preview-alias lab-commercial-prices-2026-10-07 2>&1 | tee preview-output.txt
          echo "### Prévia comercial consolidada" >> "$GITHUB_STEP_SUMMARY"
          echo "App.jsx persistido + preços dinâmicos + carência de download no mesmo build." >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[^[:space:]\"]+' preview-output.txt | grep -E 'workers.dev|cloudflare' | sort -u | tee -a "$GITHUB_STEP_SUMMARY" || true
