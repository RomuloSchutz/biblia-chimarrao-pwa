name: Gerar cards individuais
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Gerar arquivos individuais
        run: |
          SRC=public/cards-final-sprite.webp
          convert "$SRC" -crop 512x256+0+0 +repage -quality 94 public/card-devocional.webp
          convert "$SRC" -crop 512x256+512+0 +repage -quality 94 public/card-caminhada.webp
          cp public/card-caminhada.webp public/card-encontro.webp
          convert "$SRC" -crop 512x256+1024+0 +repage -quality 94 public/card-favoritos.webp
          convert "$SRC" -crop 512x256+0+256 +repage -quality 94 public/card-anotacoes.webp
          convert "$SRC" -crop 512x256+512+256 +repage -quality 94 public/card-meus-livros.webp
          convert "$SRC" -crop 512x256+1024+256 +repage -quality 94 public/card-ideias.webp
          convert "$SRC" -crop 512x256+0+512 +repage -quality 94 public/card-hora-mate.webp
          convert "$SRC" -crop 512x256+1024+512 +repage -quality 94 public/card-redes.webp
          convert "$SRC" -crop 512x256+0+768 +repage -quality 94 public/card-livros-romulo.webp
          convert "$SRC" -crop 512x256+512+768 +repage -quality 94 public/card-sobre-autor.webp
          convert "$SRC" -crop 512x256+1024+768 +repage -quality 94 public/card-mensagem.webp
      - name: Gravar somente os arquivos de imagem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/card-*.webp
          git diff --cached --quiet && exit 0
          git commit -m "Gerar 12 cards individuais aprovados"
          git push
