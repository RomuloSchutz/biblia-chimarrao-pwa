name: Publicar produção
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Compilar aplicativo
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://srabzgokulsiujusbqxl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TjLHUAq038yLQ2hqqaVZjg__GM4w2Q4
      - name: Publicar aplicativo oficial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name biblia-chimarrao-pwa
